[config]
schemaVersion = "0.0.1"

[package]
# The Thunderstore team that owns the listing; created by the owner with the account (docs/live-link.mdx#release).
namespace = "TheValheimWiki"
name = "LiveSeedMap"
versionNumber = "1.5.1"
description = "A realtime map of your Valheim server in a browser, through the Realtime Map from seed companion mod at thevalheim.wiki."
websiteUrl = "https://thevalheim.wiki/guides/live-seed-map"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "../dist"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "./bin/Release/LiveSeedMap.dll"
target = "plugins/LiveSeedMap.dll"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["client-side", "utility", "tools"]
